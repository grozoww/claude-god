[project]
name = "claude-god"
version = "0.1.0"
description = "Multi-agent end-to-end task runner driving Claude Code headlessly"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
god = "god.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/god"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["server/tests"]

[tool.uv]
package = true
