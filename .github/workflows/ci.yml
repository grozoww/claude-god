name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch cancels the run still going for the old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the version used day to day.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check server scripts

      - name: Tests
        # The suite uses a fake runner, so it never calls Claude and costs nothing.
        run: uv run pytest server/tests -q

  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        # install.sh / uninstall.sh run before anything else is set up, so a
        # typo in them is the worst possible first impression.
        run: shellcheck -S warning install.sh uninstall.sh

  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Build
        working-directory: ui
        run: npm run build
